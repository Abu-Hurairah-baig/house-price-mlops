# ML pipeline: get data -> test data -> train -> quality gate -> test API -> build & push image 

name: ML pipeline 

  

on: 

  push: 

    branches: [main] 

  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab 

  

jobs: 

  train-test-build: 

    runs-on: ubuntu-latest 

    env: 

      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/house-api 

  

    steps: 

      - name: Get the code 

        uses: actions/checkout@v4 

  

      - name: Set up Python 3.13 

        uses: actions/setup-python@v5 

        with: 

          python-version: "3.13" 

  

      - name: Install libraries 

        run: pip install -r requirements-dev.txt 

  

      - name: Get the data from S3 (dvc pull) 

        env: 

          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }} 

          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }} 

        run: dvc pull 

  

      - name: Data tests 

        run: python -m pytest tests/test_data.py 

  

      - name: Train the model 

        run: python train.py 

  

      - name: Quality gate (MAE must be below the pass mark) 

        run: python -m pytest tests/test_model.py 

  

      - name: Use the new model as the champion 

        run: cp model.pkl champion.pkl 

  

      - name: API tests 

        run: python -m pytest tests/test_api.py 

  

      - name: Save the score as a report 

        if: always() 

        uses: actions/upload-artifact@v4 

        with: 

          name: metrics 

          path: metrics.json 

  

      - name: Log in to Docker Hub 

        uses: docker/login-action@v3 

        with: 

          username: ${{ secrets.DOCKERHUB_USERNAME }} 

          password: ${{ secrets.DOCKERHUB_TOKEN }} 

  

      - name: Build and push the image 

        run: | 

          docker build -t $IMAGE:build-${{ github.run_number }} . 

          docker push $IMAGE:build-${{ github.run_number }}